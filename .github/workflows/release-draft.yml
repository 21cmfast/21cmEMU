name: Update Draft Release

# Draft releases from main only. Running on every branch push (a) retargets the
# shared draft release at whatever branch was pushed, and (b) races with
# auto-merged Dependabot/pre-commit-ci PRs: release-drafter fetches its config via
# the API at the pushed ref, so if the head branch is deleted after the merge
# before that fetch happens, the lookup 404s and the job fails.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  draft-release:
    name: Update Draft Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Publish the release notes
        uses: release-drafter/release-drafter@v7.10.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
